name: Android APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        id: gradle_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Publish concise build error
        if: steps.gradle_build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.existsSync('build.log') ? fs.readFileSync('build.log', 'utf8') : 'build.log not found';
            const lines = raw.split('\n');
            const markers = ['FAILURE:', 'What went wrong:', 'error:', 'e:', 'Caused by:'];
            let start = lines.findIndex(line => markers.some(marker => line.includes(marker)));
            if (start < 0) start = Math.max(0, lines.length - 120);
            const excerpt = lines.slice(Math.max(0, start - 10), Math.min(lines.length, start + 140)).join('\n').slice(0, 55000);
            const title = 'CI build failure diagnostic';
            const body = `Automated diagnostic for commit ${context.sha}.\n\n\`\`\`text\n${excerpt}\n\`\`\``;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const issue = existing.data.find(item => item.title === title);
            if (issue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Upload APK
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-Browser-TV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-Browser-TV-build-log
          path: build.log
          if-no-files-found: warn

      - name: Fail workflow when build failed
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1
